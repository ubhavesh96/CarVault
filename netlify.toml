# The whole app runs on Netlify: the React client as static files, and the Express API as a
# Netlify Function. /api/* is rewritten to the function, so the client keeps calling /api.

[build]
  command = "npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Sample photo and licensed reference photos for the seeded demo vehicles.
  included_files = ["server/assets/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Single-page app: every other path loads index.html (/garage, /v/:id, /d/:token, ...)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
